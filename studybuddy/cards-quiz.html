<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Dynamic Olympiad Quiz</title>
		<link rel="manifest" href="./manifest.json" />
		<link rel="stylesheet" href="./bright-steps.css" />
	</head>
	<body>
		<main class="container">
			<h1>Dynamic Olympiad Quiz</h1>
			<div class="controls">
				<label
					>Subject:
					<select id="subjectSelect"></select>
				</label>
				<label
					>Difficulty:
					<select id="difficultySelect">
						<option value="easy">Easy</option>
						<option value="medium" selected>Medium</option>
						<option value="hard">Hard</option>
					</select>
				</label>
				<button id="newBtn">New Question</button>
			</div>

			<section id="questionArea" class="card hidden">
				<div id="questionText" class="question"></div>
				<div id="choices" class="choices"></div>
				<div class="meta">Pattern: <span id="patternLabel">—</span></div>
				<div class="actions">
					<button id="showAnswerBtn">Show Answer</button>
					<button id="nextBtn">Next</button>
				</div>
				<div id="answerArea" class="answer hidden"></div>
			</section>
			<footer>
				<small>PWA-ready. Try installing to your device.</small>
			</footer>
		</main>

		<script src="./bright-steps-generator.js"></script>
		<script src="./bright-steps.js"></script>
		<script>
			console.log('ServiceWorker supported?', 'serviceWorker' in navigator);
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker
					.register('./sw.js')
					.then(reg => {
						console.log('ServiceWorker registered', reg);
					})
					.catch(err => {
						console.error('ServiceWorker registration failed:', err);
					});
			}
		</script>
	</body>
</html>
