<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>ABC Adventure — Asset Review</title>
		<style>
			body {
				font-family: Inter, system-ui, Arial, sans-serif;
				margin: 0;
				padding: 18px;
				background: #f6f7fb;
				color: #242038;
			}
			h1 {
				margin: 0 0 14px;
				font-size: 20px;
			}
			.controls {
				display: flex;
				gap: 8px;
				align-items: center;
				margin-bottom: 14px;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
				gap: 12px;
			}
			.card {
				background: #fff;
				border-radius: 10px;
				padding: 12px;
				box-shadow: 0 6px 16px rgba(20, 18, 36, 0.06);
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 8px;
			}
			.card img {
				width: 112px;
				height: 112px;
				object-fit: contain;
				border-radius: 10px;
				background: #fff;
			}
			.word {
				font-weight: 700;
				color: #222;
				text-align: center;
			}
			.meta {
				font-size: 12px;
				color: #666;
			}
			.flag {
				background: #fff;
				border: 1px solid #ff9f45;
				color: #b25b00;
				padding: 6px 8px;
				border-radius: 8px;
				cursor: pointer;
			}
			.flag.flagged {
				background: #ffedd5;
				border-color: #ff9f45;
			}
			.toolbar {
				margin-left: auto;
			}
			.small {
				font-size: 13px;
			}
		</style>
	</head>
	<body>
		<h1>ABC Adventure — Generated SVG Review</h1>
		<div class="controls">
			<div class="small">Loaded mapping: <span id="count">0</span></div>
			<div class="toolbar">
				<button id="download" class="small">Download CSV (with flags)</button>
				<button id="selectAll" class="small">Flag All</button>
				<button id="clearAll" class="small">Clear Flags</button>
			</div>
		</div>
		<div id="grid" class="grid"></div>

		<script src="./tools/review.js"></script>
	</body>
</html>
